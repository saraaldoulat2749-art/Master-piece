<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CarePlus Navigation</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header class="careplus-navbar" aria-label="CarePlus Healthcare navigation">
        <a class="careplus-navbar__brand" href="../Home/Master.html" aria-label="CarePlus home">
            <span class="careplus-navbar__logo" aria-hidden="true">
                <svg viewBox="0 0 48 48" focusable="false"><path d="M24 41S6 29 6 17.5C6 10.8 10.8 7 16.1 7c3.4 0 6.1 1.8 7.9 4.8C25.8 8.8 28.5 7 31.9 7 37.2 7 42 10.8 42 17.5 42 29 24 41 24 41Z"/><path d="M11 24h7l3-6 5.5 13 4-8H37"/></svg>
            </span>
            <span class="careplus-navbar__name">Care<span>Plus</span></span>
        </a>

        <input class="careplus-navbar__toggle" type="checkbox" id="careplus-navbar-toggle" aria-label="Toggle navigation menu">
        <label class="careplus-navbar__menu-button" for="careplus-navbar-toggle" aria-label="Open navigation menu">
            <span></span><span></span><span></span>
        </label>

        <nav class="careplus-navbar__links" aria-label="Main navigation">
            <a class="active" href="../Home/Master.html">Home</a>
            <a href="../Home/Master.html#services">Services</a>
            <a href="../Home/Master.html#about">About</a>
            <a href="../Home/Master.html#contact">Contact</a>
            <a class="careplus-navbar__signup-mobile" href="../log%20in/register.html">SIGN UP</a>
        </nav>

        <div class="careplus-navbar__actions">
            <a class="careplus-navbar__signup" href="../log%20in/register.html">Sign Up</a>
            <a class="careplus-navbar__login" href="../log%20in/login.html" data-auth-toggle>Log In</a>
            <div class="careplus-navbar__profile" data-customer-profile hidden>
                <button class="careplus-navbar__profile-trigger" type="button" data-profile-trigger aria-label="Open customer menu" aria-expanded="false" aria-haspopup="true">
                    <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="8" r="3.5"/><path d="M5 20a7 7 0 0 1 14 0"/></svg>
                </button>
                <div class="careplus-navbar__profile-menu" data-profile-menu hidden>
                    <a href="../Profile/index.html" data-profile-link>My Profile</a>
                    <button type="button" data-profile-logout>Log Out</button>
                </div>
            </div>
        </div>
    </header>
</body>
</html>
