
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">

    
<title>Sign Up | CarePlus</title>



    <link rel="stylesheet" href="login.css">
    <link rel="stylesheet" href="register.css">
<link rel="stylesheet" href="../shared/global-button-theme.css"></head>

<body data-initial="register">

    <div class="background" aria-hidden="true">
        <div class="glow glow-one"></div>
        <div class="glow glow-two"></div>
        <div class="light-line line-one"></div>
        <div class="light-line line-two"></div>
        <div class="light-line line-three"></div>
        <div class="light-line line-four"></div>
    </div>

    <main class="auth-shell">

        <a class="brand" href="../Home/Master.html">
            <span class="brand-icon">✚</span>
            <span>Care<strong>Plus</strong></span>
        </a>

        <section class="auth-card">

            <div class="card-sheen"></div>

            <header class="card-header">

                <p class="eyebrow">
                    <span class="status-dot"></span>
                    JOIN CAREPLUS
                </p>

                <h1>Create <em>Account</em></h1>

                <p>
                    Join us today to access your healthcare services.
                </p>

            </header>

            <form id="register-form" novalidate>

                <div class="field-group">
                    <label for="register-name">Full Name</label>

                    <div class="input-box">
                        <span class="input-icon">♙</span>

                        <input
                            id="register-name"
                            name="name"
                            type="text"
                            placeholder="Your full name"
                            autocomplete="name"
                            required>
                    </div>
                </div>

                <div class="field-group">
                    <label for="register-email">
                        Email Address
                    </label>

                    <div class="input-box">
                        <span class="input-icon">✉</span>

                        <input
                            id="register-email"
                            name="email"
                            type="email"
                            placeholder="name@example.com"
                            autocomplete="email"
                            required>
                    </div>
                </div>

                <div class="field-group">
                    <label for="register-phone">
                        Phone Number
                        <span class="optional">(Optional)</span>
                    </label>

                    <div class="input-box">
                        <span class="input-icon">☎</span>

                        <input
                            id="register-phone"
                            name="phone"
                            type="tel"
                            placeholder="Your phone number"
                            autocomplete="tel">
                    </div>
                </div>

                <div class="two-columns">

                    <div class="field-group">

                        <label for="register-password">
                            Password
                        </label>

                        <div class="input-box">
                            <span class="input-icon">♙</span>

                            <input
                                id="register-password"
                                name="password"
                                type="password"
                                placeholder="Min. 8 characters"
                                autocomplete="new-password"
                                minlength="8"
                                required>

                            <button
                                type="button"
                                class="eye-button"
                                data-toggle="register-password"
                                aria-label="Show password">
                                ◉
                            </button>
                        </div>

                    </div>

                    <div class="field-group">

                        <label for="register-confirm">
                            Confirm Password
                        </label>

                        <div class="input-box">
                            <span class="input-icon">♙</span>

                            <input
                                id="register-confirm"
                                name="confirm"
                                type="password"
                                placeholder="Repeat password"
                                autocomplete="new-password"
                                required>

                            <button
                                type="button"
                                class="eye-button"
                                data-toggle="register-confirm"
                                aria-label="Show password">
                                ◉
                            </button>
                        </div>

                    </div>

                </div>

                <label class="check terms">
                    <input type="checkbox" id="terms" required>
                    <span>
                        I agree to the Terms &amp; Privacy Policy
                    </span>
                </label>

                <p
                    id="register-message"
                    class="notice"
                    role="alert"
                    aria-live="polite"
                    hidden>
                </p>

                <button
                    id="register-submit"
                    type="submit"
                    class="submit">

                    <span class="button-label">
                        Create Account
                    </span>

                    <span class="spinner"></span>
                    <span class="arrow">→</span>

                </button>

            </form>

            <p class="switch-text">
                Already have an account?
                <a href="login.html" class="page-link">
                    Sign In
                </a>
            </p>

        </section>

        <p class="footer-text">
            CarePlus · Caring for you, every step of the way.
        </p>

    </main>

    <script src="../auth.js?v=archive-aware-1"></script>
    <script src="../data/careplus-data.js?v=archive-aware-1"></script>
    <script src="auth-motion.js"></script>
    <script src="register.js"></script>

</body>
</html>
