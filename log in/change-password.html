<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#080d13">
  <title>Change Password | CarePlus</title>
  <link rel="stylesheet" href="login.css">

  <style>
    .change-password-panel {
      display: block;
      position: relative;
      inset: auto;
      opacity: 1;
      visibility: visible;
      pointer-events: auto;
      filter: none;
      transform: none;
    }
    .change-password-panel .panel-header { margin-bottom: 1.5rem; }
    .change-password-panel .field-group { margin: 1rem 0; }
    .change-password-panel .input-box input { width: 100%; }
    .change-password-panel .submit { width: 100%; }
    .change-password-panel .notice { margin: 1rem 0; }
  </style>
<link rel="stylesheet" href="../shared/site-headings.css?v=dancing-script-1">
</head>
<body data-protected="true">
  <div class="background" aria-hidden="true">
    <div class="glow glow-one"></div><div class="glow glow-two"></div>
    <div class="light-line line-one"></div><div class="light-line line-two"></div>
    <div class="light-line line-three"></div><div class="light-line line-four"></div>
  </div>
  <main class="auth-shell">
    <a class="brand" href="../Home/Master.html"><span class="brand-icon">✚</span><span>Care<strong>Plus</strong></span></a>
    <div class="auth-card">
      <div class="card-shine"></div>
      <section class="auth-panel change-password-panel">
        <div class="panel-header">
          <p class="eyebrow"><span class="status-dot"></span> SECURE YOUR ACCOUNT</p>
          <h1>Change <em>Password</em></h1>
          <p class="subtitle">For your security, set a new password before continuing.</p>
        </div>
        <form id="change-password-form" novalidate>
          <div class="field-group">
            <label for="new-password">New password</label>
            <div class="input-box"><input id="new-password" type="password" autocomplete="new-password" minlength="8" maxlength="128" placeholder="8–128 characters" required></div>
          </div>
          <div class="field-group">
            <label for="confirm-password">Confirm new password</label>
            <div class="input-box"><input id="confirm-password" type="password" autocomplete="new-password" minlength="8" maxlength="128" placeholder="Enter it again" required></div>
          </div>
          <p class="notice" id="password-message" role="status" aria-live="polite" hidden></p>
          <button type="submit" class="submit"><span class="button-label">Save New Password</span><span class="spinner"></span><span class="arrow">→</span></button>
        </form>
      </section>
    </div>
    <p class="footer-text">CarePlus · Caring for you, every step of the way.</p>
  </main>
  <script src="../auth.js?v=professional-role-access-1"></script>
  <script src="../data/careplus-data.js?v=save-rollback-6"></script><script src="../shared/professional-licenses.js?v=2"></script><script src="../shared/nurse-availability.js?v=1"></script>
  <script>
    document.getElementById("change-password-form").addEventListener("submit", async event => {
      event.preventDefault();
      const form = event.currentTarget;
      const password = document.getElementById("new-password");
      const confirmation = document.getElementById("confirm-password");
      const message = document.getElementById("password-message");
      const button = form.querySelector(".submit");
      const showMessage = (text, success = false) => {
        message.textContent = text;
        message.hidden = !text;
        message.classList.toggle("success", success);
      };
      if (password.value.length < 8 || password.value.length > 128) { showMessage("Your password must be between 8 and 128 characters."); password.focus(); return; }
      if (password.value !== confirmation.value) { showMessage("The passwords do not match."); confirmation.focus(); return; }
      button.disabled = true;
      button.classList.add("is-loading");
      try {
        const result = await window.CarePlusAuth.changeOwnPassword(password.value);
        if (!result?.ok) throw new Error(result?.error || "Could not change your password.");
        showMessage("Password updated. Taking you to your account…", true);
        const destinations = { admin: "../Admin/index.html", doctor: "../Doctor/index.html", nurse: "../Nurse/index.html", pharmacy: "../Pharmacy/dashboard.html" };
        window.location.assign(destinations[result.role] || "../Home/Master.html");
      } catch (error) {
        showMessage(error.message || "Could not change your password.");
        password.focus();
      } finally {
        button.disabled = false;
        button.classList.remove("is-loading");
      }
    });
  </script>
</body>
</html>
