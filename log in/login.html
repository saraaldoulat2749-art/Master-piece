<!doctype html>
<html lang="en" dir="ltr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#172536">
  <title>Sign in | CarePlus</title>
  <link rel="stylesheet" href="login.css">
</head>
<body>
  <main class="login-shell">
    <span class="floating-logo logo-one" aria-hidden="true"><svg viewBox="0 0 48 48"><path d="M24 41S6 29 6 17.5C6 10.8 10.8 7 16.1 7c3.4 0 6.1 1.8 7.9 4.8C25.8 8.8 28.5 7 31.9 7 37.2 7 42 10.8 42 17.5 42 29 24 41 24 41Z"/><path d="M11 24h7l3-6 5.5 13 4-8H37"/></svg></span>
    <span class="floating-logo logo-two" aria-hidden="true"><svg viewBox="0 0 48 48"><path d="M24 41S6 29 6 17.5C6 10.8 10.8 7 16.1 7c3.4 0 6.1 1.8 7.9 4.8C25.8 8.8 28.5 7 31.9 7 37.2 7 42 10.8 42 17.5 42 29 24 41 24 41Z"/><path d="M11 24h7l3-6 5.5 13 4-8H37"/></svg></span>
    <span class="floating-logo logo-three" aria-hidden="true"><svg viewBox="0 0 48 48"><path d="M24 41S6 29 6 17.5C6 10.8 10.8 7 16.1 7c3.4 0 6.1 1.8 7.9 4.8C25.8 8.8 28.5 7 31.9 7 37.2 7 42 10.8 42 17.5 42 29 24 41 24 41Z"/><path d="M11 24h7l3-6 5.5 13 4-8H37"/></svg></span>
    <span class="floating-logo logo-four" aria-hidden="true"><svg viewBox="0 0 48 48"><path d="M24 41S6 29 6 17.5C6 10.8 10.8 7 16.1 7c3.4 0 6.1 1.8 7.9 4.8C25.8 8.8 28.5 7 31.9 7 37.2 7 42 10.8 42 17.5 42 29 24 41 24 41Z"/><path d="M11 24h7l3-6 5.5 13 4-8H37"/></svg></span>
    <section class="form-side" aria-labelledby="welcome-title">
      <a class="brand" href="../Home/Master.html" aria-label="CarePlus home">
        <span class="brand-mark" aria-hidden="true"><svg viewBox="0 0 48 48"><path d="M24 41S6 29 6 17.5C6 10.8 10.8 7 16.1 7c3.4 0 6.1 1.8 7.9 4.8C25.8 8.8 28.5 7 31.9 7 37.2 7 42 10.8 42 17.5 42 29 24 41 24 41Z"/><path d="M11 24h7l3-6 5.5 13 4-8H37"/></svg></span>
        <span class="brand-word">Care<span class="brand-plus">Plus</span></span>
      </a>
      <div class="form-wrap">
        <div class="topline"></div>
        <h1 id="welcome-title">Welcome Back!</h1>

        <form id="login-form" novalidate>
          <fieldset class="role-picker"><legend>Account type</legend>
            <label class="role-option"><input type="radio" name="role" value="user" checked><span>Customer</span></label>
            <label class="role-option"><input type="radio" name="role" value="admin"><span>Administrator</span></label>
          </fieldset>
          <label class="field-label" for="identity">Email or phone</label>
          <input class="field" id="identity" name="identity" type="text" autocomplete="username" required>
          <div class="password-heading"><label class="field-label" for="password">Password</label></div>
          <div class="password-wrap"><input class="field" id="password" name="password" type="password" autocomplete="current-password" required><button class="show-password" type="button" id="toggle-password" aria-label="Show or hide password"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M2 12s3.6-7 10-7 10 7 10 7-3.6 7-10 7S2 12 2 12Z"/><circle cx="12" cy="12" r="3"/></svg></button></div>
          <label class="remember"><input type="checkbox" name="remember"><span>Remember me</span></label>
          <p class="notice" id="form-message" role="status" aria-live="polite" hidden><span class="notice-required">Enter your email or phone and password.</span><span class="notice-unavailable">Demo session could not be started in this browser.</span><span class="notice-recovery">Password recovery is not available yet.</span></p>
          <button class="submit" type="submit"><span class="button-label">Continue in demo</span><span class="spinner" aria-hidden="true"></span><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 12h14m-6-6 6 6-6 6"/></svg></button>
        </form>
        <p class="create-account">New here? <a href="register.html">Sign up</a></p>
      </div>
    </section>
  </main>

  <script src="../auth.js"></script>
  <script src="../data/careplus-data.js"></script><script src="login.js"></script>
</body>
</html>
