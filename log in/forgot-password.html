<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#080d13">
  <title>Forgot Password | CarePlus</title>
  <link rel="stylesheet" href="login.css">
  <link rel="stylesheet" href="../shared/global-button-theme.css">
  <style>
    .recovery-panel {
      position: relative;
      inset: auto;
      display: block;
      opacity: 1;
      visibility: visible;
      pointer-events: auto;
      filter: none;
      transform: none;
    }
    .recovery-panel .panel-header { margin-bottom: 1.5rem; }
    .recovery-panel .field-group { margin: 1rem 0; }
    .recovery-panel .input-box input { width: 100%; }
    .recovery-panel .submit { width: 100%; }
    .recovery-note { margin: 14px 0 0; color: #8095a0; font-size: 11px; line-height: 1.6; }
    .recovery-back { display: block; margin-top: 18px; color: #91c9cd; font-size: 12px; text-align: center; text-decoration: none; }
    .recovery-back:hover { text-decoration: underline; }
    [data-password-fields][hidden] { display: none; }
  </style>
</head>
<body>
  <div class="background" aria-hidden="true">
    <div class="glow glow-one"></div><div class="glow glow-two"></div>
    <div class="light-line line-one"></div><div class="light-line line-two"></div>
    <div class="light-line line-three"></div><div class="light-line line-four"></div>
  </div>
  <main class="auth-shell">
    <a class="brand" href="../Home/Master.html"><span class="brand-icon">✚</span><span>Care<strong>Plus</strong></span></a>
    <div class="auth-card">
      <div class="card-shine"></div>
      <section class="auth-panel recovery-panel">
        <div class="panel-header">
          <p class="eyebrow"><span class="status-dot"></span> ACCOUNT RECOVERY</p>
          <h1>Forgot <em>Password?</em></h1>
          <p class="subtitle">Enter the email and phone number saved on your account.</p>
        </div>
        <form id="recovery-form" novalidate>
          <div class="field-group">
            <label for="recovery-email">Email address</label>
            <div class="input-box"><input id="recovery-email" type="email" autocomplete="email" required placeholder="name@example.com"></div>
          </div>
          <div class="field-group">
            <label for="recovery-phone">Phone number</label>
            <div class="input-box"><input id="recovery-phone" type="tel" autocomplete="tel" required placeholder="Phone number on your account"></div>
          </div>
          <div data-password-fields hidden>
            <div class="field-group">
              <label for="new-password">New password</label>
              <div class="input-box"><input id="new-password" type="password" autocomplete="new-password" minlength="8" maxlength="128" placeholder="8–128 characters"></div>
            </div>
            <div class="field-group">
              <label for="confirm-password">Confirm new password</label>
              <div class="input-box"><input id="confirm-password" type="password" autocomplete="new-password" minlength="8" maxlength="128" placeholder="Enter it again"></div>
            </div>
          </div>
          <p class="notice" id="recovery-message" role="status" aria-live="polite" hidden></p>
          <button type="submit" class="submit"><span class="button-label">Verify account</span><span class="spinner"></span><span class="arrow">→</span></button>
        </form>
        <p class="recovery-note">Demo recovery checks the account details stored in this browser. It does not send an email or SMS code.</p>
        <a class="recovery-back" href="login.html">Back to sign in</a>
      </section>
    </div>
    <p class="footer-text">CarePlus · Caring for you, every step of the way.</p>
  </main>
  <script src="../auth.js?v=floating-customer-notifications-1"></script>
  <script src="../data/careplus-data.js?v=archive-aware-1"></script>
  <script>
    const form = document.getElementById("recovery-form");
    const emailField = document.getElementById("recovery-email");
    const phoneField = document.getElementById("recovery-phone");
    const passwordField = document.getElementById("new-password");
    const confirmField = document.getElementById("confirm-password");
    const passwordFields = document.querySelector("[data-password-fields]");
    const message = document.getElementById("recovery-message");
    const submit = form.querySelector(".submit");
    let matchedAccount = null;
    const normalizePhone = value => {
      const digits = String(value || "").replace(/\D/g, "");
      return digits.startsWith("9627") && digits.length === 12 ? `0${digits.slice(-9)}` : digits;
    };
    const showMessage = (text, success = false) => {
      message.textContent = text;
      message.hidden = !text;
      message.classList.toggle("success", success);
    };
    form.addEventListener("submit", async event => {
      event.preventDefault();
      showMessage("");
      if (!matchedAccount) {
        const email = emailField.value.trim().toLowerCase();
        if (!(window.CarePlusAuth?.isValidEmail?.(email) ?? /^\S+@\S+\.\S{2,}$/.test(email))) {
          showMessage("Enter a valid email address.");
          emailField.focus();
          return;
        }
        const phone = normalizePhone(phoneField.value);
        matchedAccount = window.CarePlusData?.list("users").find(user =>
          String(user.email || "").trim().toLowerCase() === email &&
          normalizePhone(user.phone) === phone
        ) || null;
        if (!matchedAccount) {
          showMessage("We couldn't verify those details. Check the email and phone number and try again.");
          return;
        }
        passwordFields.hidden = false;
        emailField.readOnly = true;
        phoneField.readOnly = true;
        passwordField.required = true;
        confirmField.required = true;
        submit.querySelector(".button-label").textContent = "Reset Password";
        passwordField.focus();
        return;
      }
      if (passwordField.value.length < 8 || passwordField.value.length > 128) {
        showMessage("Your new password must be between 8 and 128 characters.");
        passwordField.focus();
        return;
      }
      if (passwordField.value !== confirmField.value) {
        showMessage("The passwords do not match.");
        confirmField.focus();
        return;
      }
      submit.disabled = true;
      submit.classList.add("is-loading");
      try {
        const saved = await window.CarePlusAuth?.setDemoPassword?.(matchedAccount.email, passwordField.value);
        if (!saved) throw new Error("Could not save the new password. Please try again.");
        const updated = window.CarePlusData.update("users", matchedAccount.id, {
          mustChangePassword: false,
          passwordChangedAt: new Date().toISOString()
        });
        if (!updated) throw new Error("Password saved, but the account could not be updated. Please contact the administrator.");
        window.location.assign("login.html?reset=1");
      } catch (error) {
        showMessage(error.message || "Could not reset your password.");
      } finally {
        submit.disabled = false;
        submit.classList.remove("is-loading");
      }
    });
  </script>
</body>
</html>
